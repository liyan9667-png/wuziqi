  .figimg { position: fixed; z-index: 2; pointer-events: none; user-select: none; -webkit-user-drag: none; display: none; }
  .figimg.edgeL { -webkit-mask-image: linear-gradient(to top, #000 72%, transparent), linear-gradient(to right, #000 64%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to top, #000 72%, transparent), linear-gradient(to right, #000 64%, transparent); mask-composite: intersect; }
  .figimg.edgeR { -webkit-mask-image: linear-gradient(to top, #000 72%, transparent), linear-gradient(to left, #000 64%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to top, #000 72%, transparent), linear-gradient(to left, #000 64%, transparent); mask-composite: intersect; }
  .bubble { position: fixed; z-index: 6; pointer-events: none; max-width: min(300px, 70vw); padding: 9px 14px; border-radius: 14px;
    background: rgba(255, 250, 240, .93); color: #3b2a18; font: 16px/1.5 "KaiTi","STKaiti","Microsoft YaHei",serif; letter-spacing: 1px;
    box-shadow: 0 4px 18px rgba(0,0,0,.25); border: 1px solid rgba(200,160,90,.6); transform: translate(-50%, -100%);
    opacity: 0; transition: opacity .5s; }
  .bubble.show { opacity: 1; }
  .bubble .who { display: block; font-size: 12px; opacity: .7; margin-bottom: 2px; }
  #veil { position: fixed; inset: -10%; z-index: 12; pointer-events: none; opacity: 0;
    background:
      radial-gradient(ellipse 30% 22% at 15% 30%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 34% 26% at 45% 20%, rgba(250,252,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 24% at 80% 35%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 36% 26% at 25% 70%, rgba(248,250,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 34% 28% at 65% 75%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 40% 30% at 50% 50%, rgba(240,246,255,.9), rgba(255,255,255,0) 75%); }
  #veil.go { animation: veil 2.6s ease-in-out forwards; }
  @keyframes veil { 0% { opacity: 0; transform: translateX(-30%) scale(1.1); } 40% { opacity: 1; transform: translateX(0) scale(1); }
    60% { opacity: 1; transform: translateX(0) scale(1); } 100% { opacity: 0; transform: translateX(25%) scale(1.15); } }
  .figimg.topL { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 74%, transparent 100%), linear-gradient(to right, #000 64%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 74%, transparent 100%), linear-gradient(to right, #000 64%, transparent); mask-composite: intersect; }
  .figimg.topR { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 74%, transparent 100%), linear-gradient(to left, #000 64%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 74%, transparent 100%), linear-gradient(to left, #000 64%, transparent); mask-composite: intersect; }
  #rotateTip { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 25; display: none; text-align: center;
    padding: 16px 22px; border-radius: 14px; background: rgba(12,16,32,.72); color: #f3ead8; font-size: 16px; letter-spacing: 2px;
    border: 1px solid rgba(255,215,120,.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #rotateTip .ic { font-size: 40px; display: block; margin-bottom: 6px; animation: rot 2.2s ease-in-out infinite; }
  #rotateTip small { display: block; font-size: 12px; opacity: .7; margin-top: 6px; letter-spacing: 1px; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  #fx2d { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .aura { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%; mix-blend-mode: screen; opacity: .0;
    transform: translate(-50%, -50%); transition: opacity .3s; }
  .tag { position: fixed; z-index: 4; pointer-events: none; transform: translate(-50%, -100%); padding: 3px 12px; border-radius: 14px;
    background: rgba(20, 24, 40, .55); border: 1px solid rgba(255, 215, 120, .45); font-size: 15px; font-weight: bold; letter-spacing: 2px;
    white-space: nowrap; text-shadow: 0 0 8px currentColor; font-family: "KaiTi","STKaiti","Microsoft YaHei",serif; }
  .panel { position: fixed; z-index: 5; background: rgba(12, 16, 32, .55); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255, 215, 120, .25); border-radius: 10px; }
  .seatBtn { font-size: 15px !important; padding: 7px 14px !important; border-radius: 18px !important; background: linear-gradient(180deg,#f3e3b0,#c9a85a) !important; color: #3a2a10 !important; border: none !important; font-weight: bold; }
  #dock { left: 50%; bottom: 10px; transform: translateX(-50%); padding: 6px 50px 6px 16px; width: max-content; min-width: 260px;
    max-width: calc(100vw - 16px); text-align: center; }
  #vs { font-size: 14px; letter-spacing: 1px; font-family: "KaiTi","STKaiti","Microsoft YaHei",serif; }
  #vs b { font-weight: bold; }
  #menuBtn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; padding: 0;
    font-size: 18px; border-radius: 50%; line-height: 32px; opacity: .85; }
  #menu { right: 10px; bottom: 74px; padding: 12px 14px; width: min(380px, calc(100vw - 20px)); max-height: 72vh; overflow: auto; display: none; }
  #menu.open { display: block; }
  #menu .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 5px;
    background: linear-gradient(90deg, #fff3c4, #ffd700, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #realmName { font-size: 17px; font-weight: bold; letter-spacing: 3px; }
  #pips { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
  .pip { padding: 1px 5px; border-radius: 4px; font-size: 11px; background: rgba(255,255,255,.08);
    color: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.12); }
  #status { font-size: 14px; margin-top: 1px; }
  #moveInfo { font-size: 13px; opacity: .9; min-height: 18px; margin-top: 2px; }
  #score { font-size: 12px; opacity: .7; margin-top: 4px; }
  #bar { left: 50%; bottom: 12px; transform: translateX(-50%); padding: 8px; display: flex; flex-wrap: wrap;
    gap: 6px; justify-content: center; width: max-content; max-width: calc(100vw - 16px); }
  button, select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #8a7556; background: rgba(44, 40, 54, .9); color: #f3ead8; cursor: pointer; }
  button:hover, select:hover { background: rgba(70, 62, 84, .95); }
  #hint { position: fixed; right: 12px; top: 12px; z-index: 5; font-size: 12px; opacity: .75; text-align: right;
    text-shadow: 0 1px 3px #000; }
  #promo { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
    justify-content: center; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%); }
  #promo.show { animation: promo 3.6s ease forwards; }
  #promo h2 { margin: 0; font-size: 26px; letter-spacing: 10px; color: #fff; text-shadow: 0 0 12px #fff; }
  #promo .big { font-size: 68px; font-weight: bold; letter-spacing: 12px; margin: 10px 0; }
  #promo p { margin: 0; font-size: 18px; letter-spacing: 4px; }
  @keyframes promo { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.12); }
    25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
  #flash { position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0; }
  #loading { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: radial-gradient(ellipse at top, #24304f, #07080f); font-size: 18px;
    letter-spacing: 3px; text-align: center; padding: 20px; }
  #loading small { font-size: 13px; opacity: .7; margin-top: 10px; letter-spacing: 1px; }
  @media (max-height: 520px) {   /* 手机横屏：底部信息条更紧凑 */
    #dock { padding: 3px 44px 3px 12px; bottom: 6px; } #moveInfo { display: none; } #vs, #status { font-size: 12px; }
    #menuBtn { width: 30px; height: 30px; line-height: 28px; } #menu { bottom: 50px; max-height: 80vh; }
  }
  @media (max-width: 640px) {
    h1 { font-size: 18px; } #realmName { font-size: 15px; } #status { font-size: 14px; }
    #hint { display: none; } #info { padding: 8px 10px; } .pip { font-size: 10px; padding: 0 4px; }
    #promo .big { font-size: 48px; }
  }
</style>
</head>

const THREE_SRCS = [
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.staticfile.net/three.js/r128/three.min.js',

  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
];
let started = false;
function loadThree(i) {
  if (window.THREE) { if (!started) { started = true; init(); } return; }
  if (i >= THREE_SRCS.length) {
    document.getElementById('loadMsg').textContent = '3D 引擎加载失败';
    document.getElementById('loadSub').textContent = '请检查网络后刷新页面重试';
    return;
  }
  const s = document.createElement('script');
  let done = false;
  const next = () => { if (done) return; done = true; loadThree(i + 1); };
  s.src = THREE_SRCS[i];
  s.onload = () => { done = true; if (window.THREE && !started) { started = true; init(); } else if (!window.THREE) loadThree(i + 1); };
  s.onerror = next;
  setTimeout(() => { if (!window.THREE) next(); }, 9000);
  document.head.appendChild(s);
}
loadThree(0);

/* ===================== 云端同步（手机、电脑共用境界） ===================== */
let cloudRef = null, cloudChain = Promise.resolve(), cloudFirst = true;
function setSync(t) { const el = document.getElementById('sync'); if (el) el.textContent = t; }
function cloudWrite() {
  if (!cloudRef) return;
  const data = { realm: save.realm, win: save.win, lose: save.lose, ai: save.ai, pvp: save.pvp, at: Date.now() };
  cloudChain = cloudChain.then(() => cloudRef.set(data)).then(() => setSync('☁️ 境界已云端同步')).catch(e => { console.warn('sync', e); setSync('⚠️ 云端同步失败，已存本机'); });
}
async function cloudInit() {
  for (let i = 0; i < 50 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 200));
  if (!(window.claude && window.claude.use)) { setSync('本机保存（打开 Claude 里的链接可多设备同步）'); return; }
  try {
    const db = await window.claude.use('db'), user = await window.claude.use('user');
    if (!db || !user) { setSync('本机保存（登录 Claude 后可同步）'); return; }
    const id = await user.id();
    if (!id) { setSync('本机保存'); return; }
    const ref = db.doc('data/users/' + id + '/xiuxian');
    setSync('☁️ 正在同步……');
    const timer = setTimeout(() => setSync('☁️ 暂时连不上云端，进度先存本机'), 10000);
    ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.metadata.fromCache) clearTimeout(timer);
      const d = snap.exists ? snap.data() : null;
      if (cloudFirst) {
        if (snap.metadata.fromCache && !d) return;
        cloudFirst = false; cloudRef = ref;
        if (d) {   // 第一次合并：取两边较高的境界和战绩
          save.realm = Math.max(save.realm, Math.min(9, +d.realm || 0));
          save.win = Math.max(save.win, +d.win || 0); save.lose = Math.max(save.lose, +d.lose || 0);
          for (const k of ['1', '2', '3']) save.ai[k] = Math.max(save.ai[k] || 0, (d.ai && +d.ai[k]) || 0);
          for (const k of ['b', 'w']) save.pvp[k] = Math.max(save.pvp[k] || 0, (d.pvp && +d.pvp[k]) || 0);
        }
        persist(); onSaveChanged(); return;
      }
      if (d) {     // 之后以云端为准（其他设备升级或散功）
        save.realm = Math.min(9, Math.max(0, +d.realm || 0)); save.win = +d.win || 0; save.lose = +d.lose || 0;
        if (d.ai) save.ai = Object.assign({ 1: 0, 2: 2, 3: 4 }, d.ai); if (d.pvp) save.pvp = Object.assign({ b: 0, w: 0 }, d.pvp);
        try { localStorage.setItem('gomoku3d_xiuxian', JSON.stringify(save)); } catch (e) {}
        setSync('☁️ 境界已云端同步'); onSaveChanged();
      }
    }, e => { clearTimeout(timer); console.warn('sync', e); setSync('⚠️ 云端同步不可用，已存本机'); });
  } catch (e) { console.warn('sync', e); setSync('本机保存'); }
}
function onSaveChanged() { renderRealm(); if (started && immortalL) refreshLabels(); }
cloudInit();

let board, elems, history, turn, gameOver, aiThinking = false, soundOn = true, busy = false, gameId = 0;
const $ = id => document.getElementById(id);
const modeEl = $('mode'), levelEl = $('level');
const humanColor = () => modeEl.value === 'ai-white' ? 2 : 1;
const isAI = () => modeEl.value === 'ai' || modeEl.value === 'ai-white';
const isOnline = () => modeEl.value === 'online';
const playerLv = () => save.realm + 1;
const inB = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const rnd = (a, b) => a + Math.random() * (b - a);

function checkWin(x, y, c) {
  for (const [dx, dy] of DIRS) {
    let a = [x, y], b = [x, y], count = 1, i = x + dx, j = y + dy;
    while (inB(i, j) && board[j][i] === c) { b = [i, j]; count++; i += dx; j += dy; }
    i = x - dx; j = y - dy;
    while (inB(i, j) && board[j][i] === c) { a = [i, j]; count++; i -= dx; j -= dy; }
    if (count >= 5) return [a, b];
  }
  return null;
}

/* ===================== 电脑 AI ===================== */
function lineInfo(x, y, dx, dy, c) {
  let count = 1, open = 0, i = x + dx, j = y + dy;
  while (inB(i, j) && board[j][i] === c) { count++; i += dx; j += dy; }
  if (inB(i, j) && board[j][i] === 0) open++;
  i = x - dx; j = y - dy;
  while (inB(i, j) && board[j][i] === c) { count++; i -= dx; j -= dy; }
  if (inB(i, j) && board[j][i] === 0) open++;
  return { count, open };
}
function shapeScore(count, open) {
  if (count >= 5) return 1000000;
  if (open === 0) return 0;
  if (count === 4) return open === 2 ? 100000 : 10000;
  if (count === 3) return open === 2 ? 5000 : 500;
  if (count === 2) return open === 2 ? 300 : 50;
  return open === 2 ? 10 : 2;
}
function pointScore(x, y, c) {
  let s = 0;
  for (const [dx, dy] of DIRS) { const { count, open } = lineInfo(x, y, dx, dy, c); s += shapeScore(count, open); }
  return s;
}
function candidates() {
  const list = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (board[y][x]) continue;
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) {
      const i = x + dx, j = y + dy;
      if (inB(i, j) && board[j][i]) { near = true; break; }
    }
    if (near) list.push([x, y]);
  }
  return list;
}
function evaluateMove(x, y, me, level) {
  const atk = pointScore(x, y, me), def = pointScore(x, y, 3 - me);
  const defW = level === 1 ? 0.6 : level === 2 ? 0.9 : 1.0;
  return atk * 1.1 + def * defW + (7 - Math.max(Math.abs(x - 7), Math.abs(y - 7)));
}
function bestMove(me, level) {
  const cands = candidates();
  if (!cands.length) return [7, 7];
  const scored = cands.map(([x, y]) => ({ x, y, s: evaluateMove(x, y, me, level) })).sort((a, b) => b.s - a.s);
  if (level === 3) {
    let best = scored[0], bestVal = -Infinity;
    for (const m of scored.slice(0, 10)) {
      if (m.s >= 1000000) return [m.x, m.y];
      board[m.y][m.x] = me;
      let reply = 0;
      for (const [x, y] of candidates()) {
        const v = pointScore(x, y, 3 - me) * 1.1 + pointScore(x, y, me) * 0.8;
        if (v > reply) reply = v;
      }
      board[m.y][m.x] = 0;
      const val = m.s - reply * 0.7;
      if (val > bestVal) { bestVal = val; best = m; }
    }
    return [best.x, best.y];
  }
  if (level === 1) {
    if (scored[0].s >= 100000) return [scored[0].x, scored[0].y];
    const pool = scored.slice(0, 4), m = pool[Math.floor(Math.random() * pool.length)];
    return [m.x, m.y];
  }
  return [scored[0].x, scored[0].y];
}

/* ===================== 音效 ===================== */
let actx = null;
function tone(freq, dur, type, vol, slide, delay = 0) {
  if (!soundOn) return;
  try {
    const A = audioInit(); if (!A) return;
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(A.sfx); o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
let noiseBuf = null;
// 落子“啪嗒”：极短的噪声冲击（啪）+ 闷声（棋盘）+ 稍后一声轻的“嗒”，没有带音高的余音
function stoneClack() {
  if (!soundOn) return;
  const A = audioInit(); if (!A) return;
  const ctx = A.ctx;
  if (A.ctx.state === 'suspended') A.ctx.resume();
  if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const burst = (t0, vol, f, q, decay, type = 'bandpass') => {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf;
    const flt = ctx.createBiquadFilter(); flt.type = type; flt.frequency.value = f; flt.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.0015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
    n.connect(flt); flt.connect(g); g.connect(A.sfx); n.start(t0); n.stop(t0 + decay + 0.01);
    return g;
  };
  const t = ctx.currentTime + 0.005;
  burst(t, 0.9, 1900, 0.9, 0.035);                 // 啪：清脆的冲击
  burst(t, 0.35, 4200, 1.2, 0.02);                 // 高频的“咔”感
  burst(t, 0.45, 380, 0.7, 0.05, 'lowpass');       // 棋盘的闷声
  const ta = t + 0.085;
  burst(ta, 0.28, 2300, 1.0, 0.025);               // 嗒：轻轻一弹
  burst(ta, 0.12, 420, 0.7, 0.03, 'lowpass');
}

  stoneClack();
}

/* ===================== 视角控制 ===================== */
function setupControls() {
  const el = renderer.domElement;
  const pts = new Map();
  let downPos = null, moved = 0, pinchD = 0;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') pts.clear();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { downPos = { x: e.clientX, y: e.clientY }; moved = 0; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); moved = 999; }
  });
  el.addEventListener('pointermove', e => {
    if (pts.has(e.pointerId) && e.pointerType !== 'touch' && e.buttons === 0) { pts.delete(e.pointerId); }
    if (!pts.has(e.pointerId)) { updateGhost(e); return; }
    const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) {
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 6) {
        cam.theta -= dx * 0.006; cam.anim = null;
        cam.phi = Math.min(PHI_MAX, Math.max(0.15, cam.phi - dy * 0.005));   // 不让棋盘被翻成一条线
        ghost.visible = false;
      }
    } else if (pts.size === 2 && e.pointerType === 'touch') {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD) { cam.zoom = Math.min(cam.homeZoom * 2.5, Math.max(cam.homeZoom * 0.2, cam.zoom * pinchD / d)); cam.userZoomed = true; }
      pinchD = d;
    }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    if (moved > 6) { cam.userZoomed = true; saveView(); }
    pts.delete(e.pointerId);
    if (pts.size === 0 && moved <= 6 && downPos) handleTap(e);
    if (pts.size < 2) pinchD = 0;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', e => { pts.delete(e.pointerId); });
  el.addEventListener('lostpointercapture', e => { if (e.pointerType === 'touch') pts.delete(e.pointerId); });
  window.addEventListener('blur', () => pts.clear());
  el.addEventListener('pointerleave', () => { if (!pts.size) ghost.visible = false; });
  el.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = Math.min(cam.homeZoom * 2.5, Math.max(cam.homeZoom * 0.2, cam.zoom * (1 + e.deltaY * 0.001))); cam.userZoomed = true; clearTimeout(cam.st); cam.st = setTimeout(saveView, 400); }, { passive: false });
}
function pickCell(e) {
  const r = renderer.domElement.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(v, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(boardPlane, hit)) return null;
  const x = Math.round(hit.x + 7), y = Math.round(hit.z + 7);
  if (!inB(x, y) || Math.abs(hit.x + 7 - x) > 0.45 || Math.abs(hit.z + 7 - y) > 0.45) return null;
  return [x, y];
}
function canHumanMove() {
  if (isOnline()) return !gameOver && !!onl.nr && mySeat() === turn;
  return !gameOver && !aiThinking && !busy && (!isAI() || turn === humanColor());
}
let pending = null;   // 第一下选位置（预览），第二下落子
function clearPending() { pending = null; cam.fGoal = 0; if (ghost) { ghost.visible = false; ghost.scale.set(1, 0.42, 1); } }   // 镜头回到原来大小
function updateGhost(e) {
  if (e.pointerType === 'touch' || pending) return;
  const c = pickCell(e);
  if (!c || !canHumanMove() || board[c[1]][c[0]]) { ghost.visible = false; return; }
  ghost.visible = true; ghost.position.set(c[0] - 7, 0.19, c[1] - 7);
  ghost.material.color.set(turn === 1 ? 0x111111 : 0xffffff);
}
function handleTap(e) {
  if (!canHumanMove()) return;
  // 第二下：只要点在棋盘上，棋子就落在第一下选的位置（手指偏一点也不会下错）
  if (pending) {
    if (!onBoard(e)) { clearPending(); $('moveInfo').textContent = '已取消，请重新选择位置'; return; }   // 点棋盘外面＝取消
    const c2 = pickCell(e);

      if (board[c2[1]][c2[0]]) return;
      pending = c2; ghost.position.set(c2[0] - 7, 0.19, c2[1] - 7); tone(660, 0.05, 'sine', 0.03);

    ghost.material.color.set(turn === 1 ? 0x111111 : 0xffffff); ghost.material.opacity = 0.7; ghost.renderOrder = 10;
    tone(660, 0.05, 'sine', 0.03);
    cam.fx = c[0] - 7; cam.fz = c[1] - 7; cam.fGoal = 1;   // 镜头拉近，放大要下的位置
    $('moveInfo').textContent = '再点一下这个位置落子（点别处换位置，点棋盘外取消）';
    return;

}
function onBoard(e) {   // 点击是否落在棋盘范围内（含边框）
  const r = renderer.domElement.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(v, camera);
  const hit = new THREE.Vector3();

function makeBolt(from, to, color) {

    const len = a.distanceTo(b), mid = a.clone().add(b).multiplyScalar(0.5), q = new THREE.Quaternion().setFromUnitVectors(up, b.clone().sub(a).normalize());
    for (const [m, rr] of [[core, r], [glow, r * 3.5]]) {
      const s = new THREE.Mesh(cylGeo, m); s.scale.set(rr, len, rr); s.position.copy(mid); s.quaternion.copy(q); g.add(s);
    }
  };
  const jag = (a, b, segs, amp) => {
    const pts = [a.clone()];
    for (let i = 1; i < segs; i++) { const t = i / segs; pts.push(a.clone().lerp(b, t).add(new THREE.Vector3(rnd(-amp, amp), 0, rnd(-amp, amp)))); }
    pts.push(b.clone()); return pts;
  };
  const main = jag(from, to, 14, 1.3);
  for (let i = 0; i < main.length - 1; i++) segment(main[i], main[i + 1], 0.06);
  for (let k = 0; k < 2; k++) {
    const st = main[4 + Math.floor(rnd(0, 6))], end = st.clone().add(new THREE.Vector3(rnd(-5, 5), rnd(-8, -4), rnd(-5, 5)));
    const br = jag(st, end, 5, 0.8);
    for (let i = 0; i < br.length - 1; i++) segment(br[i], br[i + 1], 0.035);
  }
  g.userData.mats = [core, glow];
  return g;
}

function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const o = fx[i];
    if (o.delay > 0) { o.delay -= dt; if (o.delay <= 0) o.obj.visible = true; else continue; }
    o.age += dt;
    const k = 1 - o.age / o.life;
    if (k <= 0) { removeFx(o); fx.splice(i, 1); continue; }
    const ob = o.obj;
    if (o.spiral) {
      const s = o.spiral; s.th += s.w * dt; s.r += s.vr * dt; s.y = (s.y || 0) + s.vy * dt;
      if (!o.base) o.base = ob.position.clone();
      ob.position.set(o.base.x + Math.cos(s.th) * s.r, o.base.y + s.y, o.base.z + Math.sin(s.th) * s.r);
    } else if (o.vel) {
      if (o.grav) o.vel.y += o.grav * dt;
      if (o.drag) o.vel.multiplyScalar(Math.pow(o.drag, dt * 60));
      ob.position.addScaledVector(o.vel, dt);
      if (o.floor !== undefined && ob.position.y < o.floor) {
        if (o.die) { o.age = o.life; }
        else { ob.position.y = o.floor; o.vel.y *= -(o.bounce || 0); o.vel.x *= 0.7; o.vel.z *= 0.7; }
      }
    }
    if (o.rot) { ob.rotation.x += o.rot.x * dt; ob.rotation.y += o.rot.y * dt; ob.rotation.z += o.rot.z * dt; }
    if (o.spinV) ob.material.rotation += o.spinV * dt;
    if (o.grow) { const s = o.grow[0] + (o.grow[1] - o.grow[0]) * (1 - k); ob.scale.set(s, 1, s); }
    if (o.spike) { const t = 1 - k, h = t < 0.2 ? t / 0.2 : t > 0.7 ? (1 - t) / 0.3 : 1; ob.scale.set(1, Math.max(0.01, h), 1); ob.position.y = 0.6 * h - 0.1; }
    if (o.pillar) { ob.scale.set(1 + (1 - k) * 0.8, 1, 1 + (1 - k) * 0.8); }
    if (o.s0 !== undefined) { const s = o.s1 + (o.s0 - o.s1) * k; ob.scale.set(s, s, 1); }
    if (o.colorFn) o.colorFn(ob.material.color, k);
    const op = o.fadeLate ? Math.min(1, k * 3) : k;
    if (o.bolt) { const f = (Math.random() < 0.3 ? 0.3 : 1) * Math.min(1, k * 2); ob.userData.mats[0].opacity = f; ob.userData.mats[1].opacity = f * 0.6; }
    else if (o.mats) for (const m of o.mats) m.opacity = op;
    else if (ob.material) ob.material.opacity = op * (ob.material.userData.op0 || 1);
  }
}
function removeFx(o) {

  if (o.disposeGeo) o.disposeGeo.forEach(g => g.dispose());
  if (o.mats) o.mats.forEach(m => m.dispose());
  if (o.bolt) o.obj.userData.mats.forEach(m => m.dispose());
  if (o.obj.material && !o.keepMat) { if (o.disposeMap && o.obj.material.map) o.obj.material.map.dispose(); o.obj.material.dispose(); }

/* ===================== 动画循环 ===================== */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  // 落子下落
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i], rest = 0.205;
    d.vy -= 45 * dt; d.m.position.y += d.vy * dt;
    if (d.m.position.y <= rest) {
      d.m.position.y = rest;
      if (!d.bounced) { d.bounced = true; d.vy = -d.vy * 0.22; d.onLand(); }
      else { drops.splice(i, 1); }
    }
  }

  // 仙人
  for (const imm of [immortalL, immortalR]) {
    if (!imm) continue;
    const u = imm.userData;
    u.act = Math.max(0, u.act - dt * 1.4);
    imm.position.y = u.baseY + Math.sin(t * 1.1 + u.ph) * 0.18 + u.act * 0.5;
    u.whisk.rotation.z = -0.5 + Math.sin(t * 1.6 + u.ph) * 0.1 + Math.sin(t * 14) * 0.5 * u.act;
    u.ribbon.rotation.y = Math.sin(t * 0.8 + u.ph) * 0.12;

    u.haloGlow.material.opacity = 0.35 + u.act * 0.5;

  // 飞鹤
  if (dance.t >= 0) { dance.t += dt; if (dance.t > DANCE_LEN) dance.t = -1; }
  cranes.forEach((c, i) => {
    const f = c.userData.fly;
    const flyAt = tt => { const th = f.ph + tt * f.w;
      return new THREE.Vector3(Math.cos(th) * f.R * 1.6, f.h + Math.sin(th * 2) * 1.5, (f.cz || 0) + Math.sin(th) * f.R * 0.6); };
    let pos = flyAt(t), next = flyAt(t + 0.05);

    if (dance.t >= 0) {   // 赢棋：鹤群降到水面，绕着棋盘翩翩起舞
      const dt0 = dance.t, b = Math.min(1, dt0 / 1.6, (DANCE_LEN - dt0) / 1.6), e = b * b * (3 - 2 * b);
      const danceAt = tt => { const a = i / cranes.length * Math.PI * 2 + tt * 0.75;
        return new THREE.Vector3(Math.cos(a) * 11.5, 0.9 + Math.abs(Math.sin(tt * 3.2 + i)) * 1.6, Math.sin(a) * 11.5); };
      pos.lerp(danceAt(dt0), e); next.lerp(danceAt(dt0 + 0.05), e);
      flapSpeed += 4 * e; flapAmp += 0.4 * e;
    }
    c.position.copy(pos); c.lookAt(next);
    if (dance.t >= 0) c.rotateZ(Math.sin(t * 2.5 + i) * 0.25);
    const flap = Math.sin(t * flapSpeed + f.ph) * flapAmp;
    c.userData.wings[0].rotation.z = flap; c.userData.wings[1].rotation.z = -flap;
  });

  updateWater(dt, t);
  // 祥云
  for (const s of xiangyuns) {
    const u = s.userData; u.a += u.sp * dt;
    s.position.set(Math.cos(u.a) * u.d, u.y + Math.sin(t * 0.5 + u.ph) * 0.5, Math.sin(u.a) * u.d);
  }
  // 云海流动

  }

  for (const p of petals) {
    const u = p.userData;
    p.position.y -= u.vy * dt; p.position.x += (u.vx + Math.sin(t * u.sw + u.ph) * 0.6) * dt;
    p.material.rotation += u.spin * dt;
    if (p.position.y < -0.4 || p.position.x > 24) { p.position.set(rnd(-24, 10), rnd(12, 17), rnd(-12, 10)); }
  }
  // 画中仙人的光晕（境界颜色，落子时变亮）

  }

  }

    const a = cam.anim; a.t = Math.min(1, a.t + dt / 0.9); const e = a.t < .5 ? 2 * a.t * a.t : 1 - Math.pow(-2 * a.t + 2, 2) / 2;

  if (onl.doneG === g) { updateStatus(); return; }
  onl.doneG = g;
  const me = mySeat();
  if (!celebrate) { updateStatus(); return; }   // 中途加入看到的旧结果不重复计分
  if (me === c) {
    save.win++; const before = save.realm; if (save.realm < 9) save.realm++;
    persist(); renderRealm(); promote(before); publish();
  } else if (me) {
    save.lose++; persist(); renderRealm(); bigBurst('#ff5e6c', 5);
  } else bigBurst('#ffd700', 6);
  updateStatus();
}
function onlineMove(x, y) {
  const r = onl.rec;
  if (mySeat() !== turn || r.m.includes(y * 15 + x)) return;
  setRec({ ...r, v: r.v + 1, m: [...r.m, y * 15 + x] });
}
function onlineStatusText() {
  if (!onl.nr) return '联机对战：进入房间后开始';
  const r = onl.rec, me = mySeat();
  if (!r.b || !r.w || !presentIds().has(r.b) || !presentIds().has(r.w)) return me ? '等待另一位道友入座……（把二维码发给家人）' : '有空座，点下面按钮坐下对弈';
  if (gameOver) {
    const wc = history.length ? history[history.length - 1].c : 0;
    if (!wc) return '对局结束';
    return me === wc ? '🎉 你赢了！' : me ? `${nameOf(wc === 1 ? r.b : r.w)}获胜，再来一局吧` : `${nameOf(wc === 1 ? r.b : r.w)}（${NAME[wc]}）获胜`;
  }
  if (me === turn) return `轮到你落子（${NAME[turn]}）`;
  return `等待${nameOf(turn === 1 ? r.b : r.w)}落子（${NAME[turn]}）${me ? '' : '　你在观战'}`;
}
function renderOnline(msg) {
  const box = $('roomInfo'); if (!box) return;
  if (msg) { box.textContent = msg; return; }
  if (!onl.nr) { box.textContent = '还没进入房间'; return; }
  const r = onl.rec, here = presentIds();
  const watchers = [...here].filter(id => id !== r.b && id !== r.w);
  const tag = id => (id && !here.has(id) ? '（已离开）' : '');
  box.innerHTML = '';
  const line = t => { const d = document.createElement('div'); d.textContent = t; box.appendChild(d); };
  line(`🏠 房间 ${onl.code}　把房间号告诉朋友即可同桌`);
  line(`⚫ 黑方：${nameOf(r.b)}${tag(r.b)}${r.b ? ' · ' + REALMS[lvOf(r.b) - 1].name : ''}`);
  line(`⚪ 白方：${nameOf(r.w)}${tag(r.w)}${r.w ? ' · ' + REALMS[lvOf(r.w) - 1].name : ''}`);
  line(`👀 观棋（${watchers.length}/10）：${watchers.length ? watchers.map(nameOf).join('、') : '暂无'}`);
  const me = mySeat();
  $('newGame').style.display = me ? '' : 'none';
  $('takeSeat').style.display = !me && (!r.b || !here.has(r.b)) ? '' : 'none';
  $('takeSeatW').style.display = !me && (!r.w || !here.has(r.w)) ? '' : 'none';
  $('watchBtn').style.display = me ? '' : 'none';
  const fb = !me && (!r.b || !here.has(r.b)), fw = !me && (!r.w || !here.has(r.w));
  $('seatBar').style.display = isOnline() && (fb || fw) ? 'flex' : 'none';
  $('sitB').style.display = fb ? '' : 'none'; $('sitW').style.display = fw ? '' : 'none';
  $('watchBtn').textContent = '让座去观棋';
  updateStatus();
}
function onlineLabels() {
  const r = onl.rec;
  const lab = (id, col) => id ? `${col}·${nameOf(id)}·${REALMS[lvOf(id) - 1].name}` : `${col}·空位`;
  setLabel(immortalL, lab(r.b, '黑'), r.b ? REALMS[lvOf(r.b) - 1].color : '#ffffff');
  setLabel(immortalR, lab(r.w, '白'), r.w ? REALMS[lvOf(r.w) - 1].color : '#ffffff');
  if (r.b) setHalo(immortalL, REALMS[lvOf(r.b) - 1].color);
  if (r.w) setHalo(immortalR, REALMS[lvOf(r.w) - 1].color);
}
$('joinRoom').onclick = () => joinRoom($('roomCode').value);
$('newGame').onclick = () => {
  const r = onl.rec, here = presentIds();
  if (!mySeat()) return;
  // 新局黑白互换；离开的人让出座位
  const b = r.w && here.has(r.w) ? r.w : null, w = r.b && here.has(r.b) ? r.b : null;
  setRec({ g: r.g + 1, v: r.v + 1, b, w, m: [] });
};
function sitAt(seat) {
  const r = onl.rec, here = presentIds();
  if (!onl.nr || mySeat()) return;
  if (r[seat] && here.has(r[seat])) { renderOnline(); return; }   // 已经有人坐了
  onl.watch = false;
  const nr = { ...r, v: r.v + 1 }; nr[seat] = onl.uid;
  if (r.m.length) { nr.g = r.g + 1; nr.m = []; }   // 换人就开新局
  if (!nr.g) nr.g = 1;
  setRec(nr); $('menu').classList.remove('open');
}
$('takeSeat').onclick = () => sitAt('b');
$('takeSeatW').onclick = () => sitAt('w');
$('sitB').onclick = e => { e.stopPropagation(); sitAt('b'); };
$('sitW').onclick = e => { e.stopPropagation(); sitAt('w'); };
$('watchBtn').onclick = () => {
  const me = mySeat(), r = onl.rec;
  if (me) {
    onl.watch = true;
    const nr = { ...r, v: r.v + 1, g: r.m.length ? r.g + 1 : r.g, m: r.m.length ? [] : r.m };
    if (me === 1) nr.b = null; else nr.w = null;
    setRec(nr);
  } else { onl.watch = !onl.watch; publish(); renderOnline(); }
};

/* ===================== 按钮 ===================== */
$('undo').onclick = () => {
  if (isOnline()) { updateStatus('联机对局不能悔棋'); return; }
  if (!started || aiThinking || busy || !history.length || gameOver) return;
  const steps = isAI() ? (history[history.length - 1].c === humanColor() ? 1 : 2) : 1;
  for (let k = 0; k < steps && history.length; k++) {
    const m = history.pop(); board[m.y][m.x] = 0; elems[m.y][m.x] = -1;
    const mesh = stoneMeshes[m.y][m.x]; if (mesh) { scene.remove(mesh); mesh.children.forEach(ch => ch.material.dispose()); }
    stoneMeshes[m.y][m.x] = null;
  }
  if (isAI() && history.length === 0 && humanColor() === 2) { reset(); return; }
  turn = history.length % 2 === 0 ? 1 : 2;
  $('moveInfo').textContent = '时光倒流……'; updateStatus();
};
$('restart').onclick = () => { if (!started) return; if (isOnline()) { $('newGame').click(); return; } reset(); };
modeEl.onchange = () => {
  if (modeEl.value !== 'online') $('seatBar').style.display = 'none';
  if (!started) return;
  $('online').style.display = isOnline() ? 'block' : 'none';
  levelEl.style.display = isAI() ? '' : 'none';
  if (!isOnline()) onlineLeave();
  buildOpponent(); reset();
  if (isOnline()) onlineEnter();
};
levelEl.onchange = () => { if (!started) return; buildOpponent(); reset(); };
$('view').onclick = () => { cam.userZoomed = false; cam.zoomRel = 1; try { localStorage.removeItem('gomoku3d_view_v2'); } catch (e) {} const h = homeView(); camTo({ theta: Math.round(cam.theta / (Math.PI * 2)) * Math.PI * 2 + h.theta, phi: h.phi, zoom: h.zoom }); };
$('zoomIn').onclick = () => (cam.userZoomed = true) && camTo({ zoom: Math.max(cam.homeZoom * 0.2, cam.zoom / 1.25) });   // zoom 越小，镜头越近、棋盘越大
$('zoomOut').onclick = () => (cam.userZoomed = true) && camTo({ zoom: Math.min(cam.homeZoom * 4, cam.zoom * 1.25) });
$('flip').onclick = () => camTo({ theta: cam.theta + Math.PI });
// 主人设定的“出场大小与角度”，存在游戏链接的云端，所有人打开时都用它
let sharedView = null, viewDoc = null;
async function sharedViewInit() {
  for (let i = 0; i < 50 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 200));
  if (!(window.claude && window.claude.use)) return;
  try {
    const db = await window.claude.use('db'), user = await window.claude.use('user');
    if (!db) return;
    viewDoc = db.doc('config/view');
    const snap = await viewDoc.get();
    if (snap.exists) {
      const d = snap.data();
      sharedView = { theta: +d.theta || 0, phi: Math.min(PHI_MAX, Math.max(0.15, +d.phi || HOME_PHI)), zoomRel: Math.min(4, Math.max(0.2, +d.zoomRel || 1)) };
      if (!cam.userZoomed && started && camera) camTo({ theta: sharedView.theta, phi: sharedView.phi, zoom: cam.homeZoom * sharedView.zoomRel });
    }
    if (user && user.isOwner && user.isOwner()) $('setDefault').style.display = '';
  } catch (e) { console.warn('view', e); }
}
sharedViewInit();
function homeView() {
  const v = sharedView || { theta: 0, phi: HOME_PHI, zoomRel: 1 };
  return { theta: v.theta, phi: v.phi, zoom: (cam.homeZoom || 1) * v.zoomRel };
}
$('setDefault').onclick = async () => {
  if (!viewDoc) return;
  const v = { theta: Math.atan2(Math.sin(cam.theta), Math.cos(cam.theta)), phi: cam.phi, zoomRel: cam.zoom / (cam.homeZoom || 1) };
  try { await viewDoc.set(v); sharedView = v; updateStatus('✅ 已把现在的棋盘大小和角度设为所有人的出场默认'); }
  catch (e) { updateStatus('⚠️ 设为默认没有成功，请稍后再试'); }
  setTimeout(() => updateStatus(), 3500);
};
function saveView() { try { localStorage.setItem('gomoku3d_view_v2', JSON.stringify({ theta: cam.theta, phi: cam.phi, zoomRel: cam.zoom / (cam.homeZoom || 1) })); } catch (e) {} }
function loadView() {
  try { const v = JSON.parse(localStorage.getItem('gomoku3d_view_v2')); if (!v) return;
    cam.theta = +v.theta || 0; cam.phi = Math.min(PHI_MAX, Math.max(0.15, +v.phi || HOME_PHI)); cam.zoomRel = Math.min(2.5, Math.max(0.2, +v.zoomRel || 1)); cam.userZoomed = true;
  } catch (e) {}
}
const PHI_MAX = 1.05;
function camTo(t) { cam.anim = { from: { theta: cam.theta, phi: cam.phi, zoom: cam.zoom }, to: Object.assign({ theta: cam.theta, phi: cam.phi, zoom: cam.zoom }, t), t: 0 }; }
function defaultRadius() { const a = window.innerWidth / window.innerHeight; return Math.min(58, Math.max(36, 40 / Math.min(1, a))); }
$('menuBtn').onclick = (e) => { e.stopPropagation(); $('menu').classList.toggle('open'); };
document.addEventListener('pointerdown', (e) => { const m = $('menu'); if (m.classList.contains('open') && !m.contains(e.target) && e.target !== $('menuBtn')) m.classList.remove('open'); });
$('sound').onclick = () => { soundOn = !soundOn; $('sound').textContent = `音效：${soundOn ? '开' : '关'}`; };
$('voiceBtn').textContent = `台词语音：${voiceOn ? '开' : '关'}`;
$('voiceBtn').onclick = () => {
  voiceOn = !voiceOn; $('voiceBtn').textContent = `台词语音：${voiceOn ? '开' : '关'}`;
  try { localStorage.setItem('gomoku3d_voice', voiceOn ? 'on' : 'off'); } catch (e) {}
  if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  else sayWinLine(Math.random() < .5 ? 'L' : 'R');   // 打开时试听一句
};
$('music').textContent = `音乐：${musicOn ? '开' : '关'}`;
$('music').onclick = () => {
  musicOn = !musicOn; $('music').textContent = `音乐：${musicOn ? '开' : '关'}`;
  try { localStorage.setItem('gomoku3d_music', musicOn ? 'on' : 'off'); } catch (e) {}
  if (musicOn) musicStart(); else musicStop();
};
let resetArmed = false;
$('resetRealm').onclick = () => {
  if (!resetArmed) {
    resetArmed = true; $('resetRealm').textContent = '再点确认散功';
    setTimeout(() => { resetArmed = false; $('resetRealm').textContent = '散功重修'; }, 3000); return;
  }
  resetArmed = false; $('resetRealm').textContent = '散功重修';
  save = { realm: 0, win: 0, lose: 0, ai: { 1: 0, 2: 2, 3: 4 }, pvp: { b: 0, w: 0 } }; persist(); if (started) reset();
};
</script>
